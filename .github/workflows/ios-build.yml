name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project AssistantApp.xcodeproj
          -scheme Assistant
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/AssistantSimulator"
          CODE_SIGNING_ALLOWED=NO
          build

  build-device-ipa:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app
        run: >-
          xcodebuild
          -project AssistantApp.xcodeproj
          -scheme Assistant
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/AssistantDevice"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AssistantDevice/Build/Products/Release-iphoneos/Assistant.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Assistant.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/ArenaAssistant-unsigned.ipa" Payload)
          unzip -l "$RUNNER_TEMP/ArenaAssistant-unsigned.ipa"
      - name: Upload iPhone app package
        uses: actions/upload-artifact@v4
        with:
          name: arena-assistant-unsigned-ipa
          path: ${{ runner.temp }}/ArenaAssistant-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
