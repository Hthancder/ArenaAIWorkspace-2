name: Build iOS IPA (Unsigned for AltStore / SideStore / TrollStore)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/af5aae1b-arenaaiworkspace-2'
    paths-ignore:
      - 'scripts/probe-sources.mjs'
      - '.github/workflows/probe-sources.yml'
      - 'scripts/probe-new-sources.ts'
      - 'scripts/probe-new-sources.bundle.mjs'
      - 'scripts/probe-stubs/**'
      - '.github/workflows/probe-new-sources.yml'
    tags:
      - 'v*'

jobs:
  build-ios-ipa:
    name: Build HolySic iOS (.ipa)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode 26 (Expo SDK 55 · iOS 15.1+ deployment target)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ') ($XCODE)"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Generate native iOS Xcode project (Expo Prebuild)
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Harden the widget target for iOS 15 (weak-link iOS 16+ frameworks, no asset symbols)
        run: node scripts/ios/harden-widget-target.js ios HolySicWidget

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile Unsigned Release iOS App
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            grep -E "error:|fatal error|Error:|^ld: |Undefined symbols|cannot link|not an allowed client|was built for newer" xcodebuild.log | sort -u | head -30 | while IFS= read -r line; do
              echo "::error title=xcodebuild::${line:0:900}"
            done
            tail -40 xcodebuild.log | while IFS= read -r line; do echo "::warning title=xcodebuild tail::${line:0:500}"; done
            exit 1
          fi

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify minimum iOS version (MinimumOSVersion)
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist")
          echo "::notice title=MinimumOSVersion::$MIN_OS"
          FILE_SHARING=$(/usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$APP_PATH/Info.plist" 2>/dev/null || echo missing)
          echo "::notice title=Files app folder (UIFileSharingEnabled)::$FILE_SHARING"
          if [ ! -s "$APP_PATH/main.jsbundle" ]; then
            echo "::error title=JS bundle::main.jsbundle missing from $APP_PATH (app would launch to a blank screen)"
            exit 1
          fi
          echo "::notice title=JS bundle::main.jsbundle $(du -h "$APP_PATH/main.jsbundle" | cut -f1) · $(head -c 4 "$APP_PATH/main.jsbundle" | xxd -p)"
          if [ "$(printf '%s\n' "$MIN_OS" "15.1" | sort -V | tail -n1)" != "15.1" ]; then
            echo "::error title=Deployment target::App requires iOS $MIN_OS (expected 15.1)"
            exit 1
          fi

      - name: Widget extension + embed entitlements (App Group) with ldid
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          APPEX="$APP_PATH/PlugIns/HolySicWidget.appex"
          if [ ! -d "$APPEX" ]; then
            echo "::error title=Widget::HolySicWidget.appex is missing from $APP_PATH/PlugIns"
            exit 1
          fi
          WMIN=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APPEX/Info.plist")
          echo "::notice title=Widget::HolySicWidget.appex embedded (MinimumOSVersion $WMIN)"
          WEXE0=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPEX/Info.plist")
          WINFO=$(plutil -convert json -o - "$APPEX/Info.plist" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" · ".join(f"{k}={d.get(k)}" for k in ["CFBundleIdentifier","CFBundleExecutable","CFBundlePackageType","CFBundleShortVersionString","CFBundleVersion","MinimumOSVersion"]) + " · ext=" + str(d.get("NSExtension")))')
          echo "::notice title=Widget Info.plist::$WINFO"
          # dyld must be able to start the extension on iOS 15, or iOS never lists the widget:
          # every library not shipped with iOS 15 becomes a weak link (report → annotations)
          python3 scripts/ios/weaklink-macho.py "$APPEX/$WEXE0" | tee widget-macho.txt
          echo "::notice title=Widget binary (libraries dyld loads)::$(grep -v '^ *$' widget-macho.txt | tr '\n' '|' | cut -c1-3500)"
          # Unsigned builds carry no entitlements; sideloaders (TrollStore, AltStore, SideStore) read
          # them from the binary, so fake-sign with ldid to keep the App Group the widget reads from.
          brew list ldid >/dev/null 2>&1 || brew install ldid || true
          if command -v ldid >/dev/null 2>&1; then
            WEXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPEX/Info.plist")
            AEXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
            ldid -S"ios/.targets/HolySicWidget/generated.entitlements" "$APPEX/$WEXE"
            ldid -S"ios/HolySic/HolySic.entitlements" "$APP_PATH/$AEXE"
            echo "::notice title=Entitlements::$(ldid -e "$APP_PATH/$AEXE" | grep -o 'group\.[a-z.]*' | head -n 1) embedded in app + widget"
          else
            echo "::warning title=ldid::ldid unavailable; the IPA has no embedded App Group (widget would show its empty state)"
          fi

      - name: Package HolySic-TrollStore.tipa (TROLLTROLL team id + widget container)
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if command -v ldid >/dev/null 2>&1; then
            bash scripts/ios/trollstore-sign.sh "$APP_PATH" ios/HolySic/HolySic.entitlements \
              ios/.targets/HolySicWidget/generated.entitlements HolySic-TrollStore.tipa
          else
            echo "::error title=TrollStore::ldid unavailable; no .tipa built"
            exit 1
          fi
          ls -lh HolySic-TrollStore.tipa

      - name: Release notes (credits)
        run: |
          {
            echo "## HolySic iOS — TrollStore build"
            echo ""
            echo "TrollStore: HolySic-TrollStore.tipa (widget-ready). Minimum iOS 15.1."
            echo ""
            echo "HolySic started life as a fork of **Mochy Music** by realidkroo — https://github.com/realidkroo/Mochy-Music (GPL-3.0)."
            echo "Merged ideas from Spotube, OpenSpot, Musike and Cog; see NOTICE for every credit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HolySic-TrollStore.tipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolySic-TrollStore
          path: HolySic-TrollStore.tipa
          if-no-files-found: error
          retention-days: 30
