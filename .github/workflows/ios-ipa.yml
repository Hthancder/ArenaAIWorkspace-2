name: Build iOS IPA (Unsigned for AltStore / SideStore / TrollStore)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/af5aae1b-arenaaiworkspace-2'
    tags:
      - 'v*'

jobs:
  build-ios-ipa:
    name: Build Mochy Music iOS (.ipa)
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ') ($XCODE)"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Generate native iOS Xcode project (Expo Prebuild)
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile Unsigned Release iOS App
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            grep -E "error:|fatal error|Error:" xcodebuild.log | sort -u | head -25 | while IFS= read -r line; do
              echo "::error title=xcodebuild::${line:0:900}"
            done
            tail -40 xcodebuild.log | while IFS= read -r line; do echo "::warning title=xcodebuild tail::${line:0:500}"; done
            exit 1
          fi

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package MochyMusic-iOS.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qry MochyMusic-iOS-Unsigned.ipa Payload
          ls -lh MochyMusic-iOS-Unsigned.ipa

      - name: Upload MochyMusic-iOS-Unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochyMusic-iOS-Unsigned-IPA
          path: MochyMusic-iOS-Unsigned.ipa
          retention-days: 30
