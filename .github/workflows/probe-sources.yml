name: Probe music sources (YouTube / JioSaavn / Monochrome)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/af5aae1b-arenaaiworkspace-2'
    paths:
      - 'scripts/probe-sources.mjs'
      - '.github/workflows/probe-sources.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe sources
        env:
          ONLY_DISCOVERY: '1'
        run: |
          node --openssl-legacy-provider scripts/probe-sources.mjs 2>&1 | tee probe.txt
          # surface the report as annotations (readable through the check-runs API)
          split -l 40 probe.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=probe ${f}::${msg}"
          done
